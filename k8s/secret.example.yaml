# Шаблон. Значения не коммитить; создавать так:
#   kubectl -n goszakup create secret generic goszakup-secrets \
#     --from-literal=GOSZAKUP_TOKEN=... --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql://postgres:<пароль>@postgres:5432/goszakup
# В промышленной эксплуатации — внешний менеджер секретов (Vault, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: goszakup-secrets
  namespace: goszakup
type: Opaque
stringData:
  GOSZAKUP_TOKEN: ""
  POSTGRES_PASSWORD: ""
  DATABASE_URL: ""
