apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: goszakup
spec:
  selector: {app: agent}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: goszakup
spec:
  replicas: 2   # агент без состояния: масштабируется горизонтально, БД только на чтение
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: agent
          image: goszakup-agent:latest   # заменить на образ из внутреннего реестра
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: goszakup-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: goszakup-secrets, key: DATABASE_URL}}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5   # во время ETL запросы к витринам ждут ~25–30 с
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
